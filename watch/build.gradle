plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.kylins.amapnav'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kylins.amapnav'; minSdk 33; targetSdk 34
        versionCode 5; versionName '0.5.0'
        buildConfigField 'boolean','SHOWCASE',(project.hasProperty('showcase')).toString()
    }
    if(project.hasProperty('showcase')) { defaultConfig { applicationId 'com.kylins.amapnav.showcase' } }
    buildFeatures { buildConfig true }
    sourceSets { main.java.srcDirs += '../common/src/main/java'; main.res.srcDirs += '../common/src/main/res' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget='17' }
}
dependencies {
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear:wear-ongoing:1.0.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
